# Replace placeholder values for your environment.
logging:
  file:
    enable: false
    level: INFO
    path: logs
    rotation: 10 MB
    retention: 7 days
  console:
    enable: true
    level: INFO
db_meta:
  host: 127.0.0.1
  port: 3306
  user: YOUR_META_USER
  password: YOUR_META_PASSWORD
  database: meta
db_dw:
  host: 127.0.0.1
  port: 3306
  user: YOUR_DW_USER
  password: YOUR_DW_PASSWORD
  database: dw
qdrant:
  host: 127.0.0.1
  port: 6333
  embedding_size: 1024
embedding:
  host: 127.0.0.1
  port: 8081
  model: BAAI/bge-large-zh-v1.5
es:
  host: 127.0.0.1
  port: 9200
  index_name: data_agent
llm:
  model_name: YOUR_MODEL_NAME
  api_key: YOUR_API_KEY
  base_url: https://api.example.com/v1
