logging:
  # 日志输出的两个目的地 文件和控制台
  file:
    enable: false    # 是否启用
    level: INFO     # 日志级别 只会输出info及更严重的级别信息 DEBUG INFO WARNING ERROR CRITICAL
    path: logs      # 路径
    rotation: "10 MB" # 每10MB生成一个文件
    retention: "7 days" # 只保留近七天的日志
  console:
    enable: true
    level: INFO

