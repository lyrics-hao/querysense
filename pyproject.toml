[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2.18",
    "cryptography>=50.0.2",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.163.1",
    "grandalf>=0.8",
    "jieba>=0.42.1",
    "langchain>=1.5.0",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.22",
    "loguru>=0.8.0",
    "omegaconf>=2.4.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
